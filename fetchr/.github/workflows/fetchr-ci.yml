name: fetchr-ci

on:
  push:
    paths:
      - '.github/workflows/fetchr-ci.yml'
      - 'pytest.ini'
      - '0.py'
      - 'run/**'
      - 'run/*.py'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'README.md'
      - 'overview.md'
      - 'config_fetchr*.py'
  pull_request:
    paths:
      - '.github/workflows/fetchr-ci.yml'
      - 'pytest.ini'
      - '0.py'
      - 'run/**'
      - 'run/*.py'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'README.md'
      - 'overview.md'
      - 'config_fetchr*.py'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      CI_TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-input -r requirements.txt
      - name: Run fetchr gate
        run: bash scripts/ci_fetchr_gate.sh --tier "${CI_TIER}"
